- name: check SQL Server Manager Studio installer exists
  win_stat:
    path: c:\setup\mssql\SSMS_installer.exe
  register: ssms_installer_file

- name: check SSMS installation already done
  win_stat:
    path: "C:\\Program Files (x86)\\Microsoft SQL Server Management Studio 18"
  register: ssms_installation

- name: get the installer
  win_get_url:
      # aka.ms/ssmsfullsetup now serves SSMS 21/22 (Visual Studio installer based),
      # whose bootstrapper hangs forever when run from a WinRM session and installs
      # to a different path. Pin the classic SSMS 18.12.1 installer instead.
      url: 'https://go.microsoft.com/fwlink/?linkid=2199013&clcid=0x409'
      dest: 'c:\setup\mssql\SSMS_installer.exe'
  # Re-download when SSMS 18 is absent even if a stale file is cached
  # (e.g. a previous run left the v22 bootstrapper under this name).
  when: not ssms_installer_file.stat.exists or not ssms_installation.stat.exists

- name: Install SSMS
  win_command: c:\setup\mssql\SSMS_installer.exe /install /quiet /norestart
  register: install_ssmss
  failed_when: install_ssmss.rc not in [0, 3010, 1641]
  changed_when: install_ssmss.rc in [0, 3010, 1641]
  when: not ssms_installation.stat.exists

- name: Reboot after install
  win_reboot:
    reboot_timeout: 600
  when: install_ssmss is changed